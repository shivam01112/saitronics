<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | Saitronics Systems Pvt Ltd</title>
    <meta
      name="description"
      content="This Saitronics solution page is coming soon."
    />

    <link rel="icon" href="assets/img/fav-icon.png" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      .coming-soon-page {
        min-height: 60vh;
        display: grid;
        place-items: center;
        padding: 6rem 0;
        background:
          linear-gradient(135deg, rgba(2, 29, 120, 0.05), transparent 42%),
          linear-gradient(315deg, rgba(238, 176, 25, 0.09), transparent 38%),
          #f5f7fa;
      }

      .coming-soon-content {
        max-width: 680px;
        margin: 0 auto;
        text-align: center;
        padding: 3.5rem 2rem;
        border-top: 4px solid var(--gold);
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(13, 33, 55, 0.12);
      }

      .coming-soon-icon {
        width: 76px;
        height: 76px;
        display: inline-grid;
        place-items: center;
        margin-bottom: 1.5rem;
        color: #ffffff;
        background: var(--navy);
        border-radius: 50%;
        font-size: 2rem;
        box-shadow: 0 12px 28px rgba(2, 29, 120, 0.2);
      }

      .coming-soon-content h1 {
        margin: 0.75rem 0 1rem;
        font-size: clamp(2.25rem, 5vw, 3.6rem);
      }

      .coming-soon-content p {
        max-width: 560px;
        margin: 0 auto 2rem;
        color: var(--text-secondary);
        font-size: 1.1rem;
      }

      .coming-soon-kicker {
        display: block;
        margin-top: 1rem;
        color: var(--blue);
        font-family: var(--font-heading);
        font-size: 0.95rem;
        font-weight: 600;
      }

      @media (max-width: 575px) {
        .coming-soon-page {
          padding: 3rem 1rem;
        }

        .coming-soon-content {
          padding: 2.75rem 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="coming-soon-page">
      <div class="container">
        <div class="coming-soon-content">
          <span class="coming-soon-icon" aria-hidden="true">
            <i class="bi bi-hourglass-split"></i>
          </span>
          <span class="eyebrow">Saitronics Solutions</span>
          <h1>Coming Soon</h1>
          <p>
            One team, from requirement to deployment. We are preparing this
            solution page and will share more information soon.
          </p>
          <span class="coming-soon-kicker">Technology that works as one.</span>
          <a href="index.html" class="btn btn-primary">
            <i class="bi bi-arrow-left me-1"></i> Back to Home
          </a>
        </div>
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
